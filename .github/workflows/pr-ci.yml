name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # The layerchart Svelte build fails on Linux, so CI runs on Windows.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run lint
        uses: ./.github/actions/run-lint

  unit-tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run unit tests
        uses: ./.github/actions/run-unit-tests

  build-and-smoke:
    needs: [lint, unit-tests]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Build extension
        id: build
        uses: ./.github/actions/build-extension
        with:
          gh_release_update_check: "false"

      - name: Upload extension zips
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: |
            ${{ steps.build.outputs.chrome_zip }}
            ${{ steps.build.outputs.firefox_zip }}

      - name: Run smoke tests
        uses: ./.github/actions/run-smoke-tests
