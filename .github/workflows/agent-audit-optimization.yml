name: Agent audit (optimization)

# 06:00 Australia/Adelaide on the 2nd of each month (day after security audit).

on:
  schedule:
    - cron: "0 6 2 * *"
      timezone: Australia/Adelaide
  workflow_dispatch:

concurrency:
  group: agent-audit-optimization
  cancel-in-progress: false

jobs:
  audit:
    name: code-optimization-audit
    if: github.repository == 'BetterSEQTA/BetterSEQTA-Plus' || vars.AGENT_AUDIT_ALLOW_FORKS == 'true'
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    env:
      AGENT_AUDIT_BASE_URL: https://9router.stroepwafel.au/v1
      AGENT_AUDIT_MODEL: fast
      AGENT_AUDIT_MAX_TURNS: "250"
      AGENT_AUDIT_MIN_TURNS: "25"
      AGENT_AUDIT_MIN_FINISH_TURNS: "32"
      AGENT_AUDIT_MAX_TOKENS: "8192"
      AGENT_AUDIT_MAX_TOKENS_TOOL: "512"
      AGENT_AUDIT_MAX_TOKENS_FINISH: "8192"
      AGENT_AUDIT_TRIM_MAX_MESSAGES: "36"
      AGENT_AUDIT_READ_MAX_BYTES: "12000"
      AGENT_AUDIT_GREP_MAX_MATCHES: "40"
      AGENT_AUDIT_EMBED_INDEX: "1"
      AGENT_AUDIT_COMPACT_TOOL_DOC: "1"
      AGENT_AUDIT_GIT_DELTA: "1"
      AGENT_AUDIT_LLM_RETRIES: "3"
      AGENT_AUDIT_LLM_STICKY: "1"
      AGENT_AUDIT_DISCORD_ATTACH_HTML: "1"
      AGENT_AUDIT_ALLOW_FORKS: ${{ vars.AGENT_AUDIT_ALLOW_FORKS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Unit tests
        run: npm run test:unit

      - name: Agent optimization audit
        run: npm run audit:agent:optimization
        env:
          AGENT_AUDIT_API_KEY: ${{ secrets.AGENT_AUDIT_API_KEY }}
          AGENT_AUDIT_DISCORD_WEBHOOK_URL: ${{ secrets.AGENT_AUDIT_DISCORD_WEBHOOK_URL }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimization-audit-report
          path: |
            optimization-audit-report.json
            optimization-audit-report.md
            optimization-audit-report.html
            optimization-audit-transcript.jsonl
          if-no-files-found: ignore
