name: Feature request
description: Suggest something new for BetterSEQTA+ or a change to an existing feature.
labels: enhancement
title: "[FR] "
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/BetterSEQTA/BetterSEQTA-Plus/issues?q=is%3Aissue) first, including closed ones, in case it's already been suggested.

  - type: textarea
    attributes:
      label: What would you like?
      description: Describe the feature in as much detail as you can, and the problem it solves.
      placeholder: It would be great if...
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Type
      options:
        - Visual / design
        - Functionality
        - Not sure
    validations:
      required: true

  - type: input
    attributes:
      label: Related bug report
      description: If this comes from a bug report, link it here.
      placeholder: https://github.com/BetterSEQTA/BetterSEQTA-Plus/issues/...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else
      description: Mockups, reference images, or examples from other apps.
    validations:
      required: false
