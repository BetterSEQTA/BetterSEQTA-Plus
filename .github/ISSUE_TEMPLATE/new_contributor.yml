name: New contributor
description: First time contributing? Tell us what you'd like to work on and we'll help you get started.
labels: ["help wanted"]
title: "[NEW CONTRIBUTOR] "
body:
  - type: markdown
    attributes:
      value: |
        Welcome to BetterSEQTA+! Fill in what you can and a maintainer will point you in the right direction. For real-time help, join the [Discord](https://discord.gg/YzmbnCDkat).

  - type: checkboxes
    attributes:
      label: About you
      options:
        - label: This is my first open source contribution
        - label: I'm new to browser extensions
        - label: I'm new to TypeScript or Svelte
        - label: I've coded before but I'm new to this project

  - type: checkboxes
    attributes:
      label: What would you like to work on?
      options:
        - label: Fixing a bug
        - label: A new feature
        - label: A plugin
        - label: UI and design
        - label: Tests
        - label: Documentation
        - label: Not sure yet, I'd like suggestions

  - type: checkboxes
    attributes:
      label: Have you read the guides?
      options:
        - label: "[CONTRIBUTING.md](https://github.com/BetterSEQTA/BetterSEQTA-Plus/blob/main/CONTRIBUTING.md)"
          required: true
        - label: "The [architecture guide](https://docs.betterseqta.org/architecture/)"
        - label: "The [plugin development guide](https://docs.betterseqta.org/plugin-development/), if you're writing a plugin"

  - type: dropdown
    attributes:
      label: Is your dev environment working?
      options:
        - Yes, `npm run dev` works
        - Partly, I'm running into issues
        - Not set up yet
    validations:
      required: true

  - type: textarea
    attributes:
      label: Errors
      description: Paste any errors you've hit.
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Questions
      description: What would you like help with? Is anything in the docs unclear?
    validations:
      required: false
