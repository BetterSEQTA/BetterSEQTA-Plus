name: Bug report
description: Something in BetterSEQTA+ is broken. For questions, ask in Discord instead.
labels: bug
title: "[BUG] "
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/BetterSEQTA/BetterSEQTA-Plus/issues?q=is%3Aissue) first, including closed ones. For general help you'll get a faster answer in [Discord](https://discord.gg/YzmbnCDkat).

  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the timetable
        2. Click a class
        3. ...
    validations:
      required: false

  - type: input
    attributes:
      label: Extension version
      description: Shown on your browser's extensions page (`chrome://extensions` or `about:addons`).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Browser
      options:
        - Chrome
        - Microsoft Edge
        - Brave
        - Opera
        - Other Chromium browser
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Confirm
      options:
        - label: I'm using an unmodified build from a store or GitHub release, without third-party plugins.
          required: true

  - type: textarea
    attributes:
      label: Screenshots and console output
      description: Screenshots, a video, or errors from the browser console all help.
      placeholder: Drag images or log files into this box to attach them.
    validations:
      required: false
